[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pin-deep"
version = "0.1.0"
description = "Recursive GitHub Actions pin checker: flag unpinned nested uses hiding behind your SHA-pinned actions"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "hao li" }]
keywords = ["github-actions", "supply-chain", "security", "pinning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Build Tools",
]

[project.scripts]
pin-deep = "pin_deep.cli:main"

[project.urls]
Homepage = "https://github.com/hahahahahahahahah6/pin-deep"

[tool.setuptools.packages.find]
where = ["."]
include = ["pin_deep*"]
